# Layer 0 Static Verify
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run T0 static verify
        shell: pwsh
        run: pwsh .opencode/tests/T0-static-verify.ps1
      - name: LFS integrity check (git archive smoke test)
        shell: bash
        run: |
          git lfs fsck 2>&1 | grep -v "should have been a pointer" || true
          git archive --format=tar HEAD >/dev/null || { echo "::error::git archive failed: LFS objects missing"; exit 1; }
  verify:
    runs-on: ubuntu-latest
    needs: static-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run image anchor verify
        shell: pwsh
        run: pwsh scripts/verify-images.ps1
      - name: Run T1 consistency check
        shell: pwsh
        run: pwsh .opencode/tests/T1-readme-consistency.ps1
  longloop-syntax:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: PowerShell syntax check (longloop scripts)
        shell: pwsh
        run: |
          $errs = $null
          foreach ($f in @("longloop/long-loop.ps1", "longloop/bootstrap.ps1")) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$null, [ref]$e)
            if ($e.Count -gt 0) {
              Write-Host "::error::$f - $($e.Count) syntax errors"
              $e | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
              $errs += $e.Count
            }
          }
          if ($errs) { exit 1 }
          Write-Host "longloop PS syntax OK"
      - name: Node syntax check (moa-loop MCP)
        run: node --check longloop/server.js
      - name: Bash syntax check (install.sh)
        if: runner.os != 'Windows'
        run: bash -n install.sh
